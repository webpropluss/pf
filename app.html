<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Prime Fit · Panel</title>

  <!-- Instalación en el celular (PWA) -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d0d0f">
  <link rel="icon" href="img/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Prime Fit">

  <link rel="stylesheet" href="css/estilos.css?v=17">
</head>
<body>

  <!-- Barra superior (solo visible en teléfonos) -->
  <div class="barra-movil">
    <button class="btn-menu" onclick="alternarMenuMovil()" aria-label="Menú">☰</button>
    <strong>Prime <span>Fit</span></strong>
  </div>

  <!-- Fondo oscuro al abrir el menú en móvil -->
  <div id="fondoMenu" onclick="cerrarMenuMovil()"></div>

  <div class="app">

    <!-- ================= SIDEBAR ================= -->
    <aside class="sidebar">
      <div class="marca">
        <img src="img/logo_black.png" alt="Prime Fit">
        <strong>Prime <span>Fit</span></strong>
      </div>

      <nav id="menu">
        <div class="nav-item activo" data-modulo="dashboard">🏠 Dashboard</div>
        <div class="nav-item" data-modulo="alumnos">👥 Alumnos</div>
        <div class="nav-item" data-modulo="disciplinas">🥊 Disciplinas</div>
        <div class="nav-item" data-modulo="horarios">🕒 Horarios</div>
        <div class="nav-item" data-modulo="instructores">🧑‍🏫 Instructores</div>
        <div class="nav-item" data-modulo="inscripciones">📝 Inscripciones</div>
        <div class="nav-item" data-modulo="pagos">💵 Pagos</div>
        <div class="nav-item" data-modulo="pases">🎟️ Pases del día</div>
        <div class="nav-item" data-modulo="ventas">🛒 Ventas</div>
        <div class="nav-item" data-modulo="productos">📦 Productos</div>
        <div class="nav-item" data-modulo="reportes">📊 Reportes</div>
        <div class="nav-item" data-modulo="usuarios">👤 Usuarios</div>
        <div class="nav-item" data-modulo="configuracion">⚙ Configuración</div>
      </nav>

      <div class="usuario">
        <strong id="usuarioNombre">—</strong>
        <span id="usuarioRol">—</span>
        <button class="btn btn-oscuro" onclick="cerrarSesion()">Cerrar sesión</button>
        <div class="version" id="versionApp">v17</div>
      </div>
    </aside>

    <!-- ================= CONTENIDO ================= -->
    <main class="contenido" id="contenido">
      <p class="cargando">Cargando…</p>
    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="js/config.js?v=17"></script>
  <script src="js/auth.js?v=17"></script>
  <script src="js/ui.js?v=17"></script>
  <script src="js/dashboard.js?v=17"></script>
  <script src="js/alumnos.js?v=17"></script>
  <script src="js/catalogos.js?v=17"></script>
  <script src="js/horarios.js?v=17"></script>
  <script src="js/inscripciones.js?v=17"></script>
  <script src="js/pagos.js?v=17"></script>
  <script src="js/pases.js?v=17"></script>
  <script src="js/ventas.js?v=17"></script>
  <script src="js/productos.js?v=17"></script>
  <script src="js/reportes.js?v=17"></script>
  <script src="js/usuarios_config.js?v=17"></script>
  <script src="js/pwa.js?v=17"></script>
  <script src="js/app.js?v=17"></script>
</body>
</html>
