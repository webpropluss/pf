<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Prime Fit · Iniciar sesión</title>

  <!-- Instalación en el celular (PWA) -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d0d0f">
  <link rel="icon" href="img/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Prime Fit">

  <link rel="stylesheet" href="css/estilos.css?v=15">
</head>
<body>

  <div class="login-contenedor">

    <!-- Panel lateral con imagen -->
    <aside class="login-lateral">
      <img src="img/login_side.png" alt="Prime Fit">
      <div class="frase">Entrena duro.<br><span>Vive Prime.</span></div>
    </aside>

    <!-- Formulario -->
    <main class="login-panel">
      <div class="login-caja">
        <img class="logo" src="img/logo_black.png" alt="Logo Prime Fit">
        <h1>Prime <span>Fit</span></h1>
        <p class="sub">Sistema de gestión del gimnasio</p>

        <div id="error" class="mensaje-error"></div>

        <form id="formLogin">
          <div class="campo">
            <label for="email">Correo</label>
            <input type="email" id="email" placeholder="admin@primefit.com" required autocomplete="username">
          </div>
          <div class="campo">
            <label for="clave">Contraseña</label>
            <input type="password" id="clave" placeholder="••••••••" required autocomplete="current-password">
          </div>
          <button type="submit" id="btnEntrar" class="btn btn-rojo">Iniciar sesión</button>
        </form>
      </div>
    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=15"></script>
  <script src="js/auth.js?v=15"></script>
  <script src="js/pwa.js?v=15"></script>
  <script>
    // Si ya hay sesión activa, entrar directo a la aplicación.
    // replace() evita que el login quede en el historial del navegador.
    function irSiHaySesion() {
      sesionActual().then(s => { if (s) location.replace('app.html'); });
    }
    irSiHaySesion();

    // El teléfono puede restaurar esta página desde su caché (al deslizar
    // "atrás"), sin volver a ejecutar los scripts: aquí se vuelve a revisar.
    window.addEventListener('pageshow', (e) => { if (e.persisted) irSiHaySesion(); });

    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnEntrar');
      const error = document.getElementById('error');
      error.classList.remove('visible');
      btn.disabled = true; btn.textContent = 'Ingresando…';

      const ok = await iniciarSesion(
        document.getElementById('email').value.trim(),
        document.getElementById('clave').value
      );

      if (ok.exito) {
        location.href = 'app.html';
      } else {
        error.textContent = ok.mensaje;
        error.classList.add('visible');
        btn.disabled = false; btn.textContent = 'Iniciar sesión';
      }
    });
  </script>
</body>
</html>
